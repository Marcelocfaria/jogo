<style>
/* Layout: menu em lista de fichas de doença; jogo = barra de status + palco (canvas) + dock de defensores. Visual: tecido escuro cor de vinho, vaso sanguíneo, células em cores de lâmina de microscópio. */
:root{
  --bg:#150a12; --panel:#25111e; --panel2:#35182a; --line:#5b2b45;
  --fg:#fbeef3; --mute:#c99bb1; --accent:#5ee6e0; --accent-ink:#06302f;
  --atp:#ffd166; --bad:#ff5d6c; --good:#7ddc6a;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}

/* menu */
#menu{overflow-y:auto;padding:20px 0 28px;gap:18px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase;display:flex;justify-content:space-between}
.title{font-family:var(--display);font-weight:800;line-height:.88;margin:10px 0 0;font-size:clamp(54px,18vw,86px);letter-spacing:-.025em}
.title span{display:block;color:var(--accent)}
.lead{margin:12px 0 0;color:var(--mute);line-height:1.5;max-width:38ch}
.levels{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.lv{width:100%;text-align:left;display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.lv:not([disabled]):active{background:var(--panel2);transform:scale(.985)}
.lv[disabled]{opacity:.45;cursor:not-allowed}
.lv .ic{width:56px;height:56px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center}
.lv .ic svg{width:40px;height:40px}
.lv small{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.lv h3{margin:2px 0 0;font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1}
.lv p{margin:3px 0 0;color:var(--mute);font-size:13.5px;line-height:1.3}
.stars{display:flex;gap:2px}
.stars svg{width:18px;height:18px;fill:var(--line)}
.stars svg.on{fill:var(--atp)}
.big .stars{gap:8px;justify-content:center}
.big .stars svg{width:44px;height:44px}
.big .stars svg.on{animation:pop .5s both}
.big .stars svg:nth-child(2).on{animation-delay:.15s}
.big .stars svg:nth-child(3).on{animation-delay:.3s}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.total{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;color:var(--mute);border-top:1px dashed var(--line);padding-top:14px;gap:12px}
.note{font-size:12px;color:var(--mute);line-height:1.4;margin:0}
.link{color:var(--mute);text-decoration:underline;font-size:12px;font-family:var(--mono)}

/* jogo */
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 0 8px}
.ib{width:42px;height:42px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:17px;font-weight:700}
.top h2{margin:0;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.05;text-align:center}
.top h2 small{display:block;font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.tr{display:flex;gap:6px}
.stats{display:flex;gap:8px;padding-bottom:8px}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;height:34px;font-family:var(--mono);font-size:14px;white-space:nowrap}
.pill svg{width:16px;height:16px;flex:none}
.pill .l{color:var(--mute);font-size:11px}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:14px;background:#1d0c17;border:1px solid var(--line)}
#cv{position:absolute;top:0;touch-action:none;display:block}
.ctl{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:8px;z-index:3}
.btn{min-height:46px;padding:0 14px;border-radius:12px;font-family:var(--display);font-weight:700;font-size:16px;background:var(--panel2);border:1px solid var(--line);flex:1}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
#toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-12px);max-width:90%;background:var(--fg);color:#2a0f1e;font-weight:700;font-size:14px;line-height:1.3;padding:8px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:5;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--bad);color:#fff}
#dock{padding:8px 0 12px;display:flex;flex-direction:column;gap:6px;flex:none}
.dh{display:flex;gap:10px;align-items:center}
.tabs{display:flex;gap:4px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{height:28px;padding:0 10px;border-radius:7px;font-family:var(--display);font-weight:700;font-size:13px;color:var(--mute)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.hint{flex:1;min-width:0;font-size:11.5px;line-height:1.3;color:var(--mute)}
.items{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.items::-webkit-scrollbar{display:none}
.tw{flex:1 0 76px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:12px;background:var(--panel);border:2px solid var(--line)}
.tw svg{width:34px;height:34px}
.tw b{font-family:var(--display);font-weight:700;font-size:12px;line-height:1.1;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw span{font-family:var(--mono);font-size:12px;color:var(--atp)}
.tw.sel{border-color:var(--accent);background:var(--panel2)}
.tw.poor{opacity:.5}
.tp{flex:1;display:flex;gap:8px;align-items:stretch;min-width:0;min-height:96px}
.tp .info{flex:1.4;min-width:0;display:flex;flex-direction:column;justify-content:center}
.tp .info b{font-family:var(--display);font-size:16px;line-height:1.1}
.tp .info small{color:var(--mute);font-size:11.5px;line-height:1.3;margin-top:2px}
.tp .btn{min-height:0;flex:1;font-size:14px;padding:0 6px;line-height:1.15}
.tp .btn small{display:block;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--atp)}
.tp .btn.x{flex:none;width:40px}

/* modal */
#modal{position:absolute;inset:0;display:flex;align-items:flex-end;background:rgba(8,3,7,.75);z-index:20;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)))}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--panel);border-top:3px solid var(--accent);border-radius:18px 18px 0 0;padding:22px 20px 22px;display:flex;flex-direction:column;gap:12px;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .k{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.sheet h3{margin:0;font-family:var(--display);font-weight:800;font-size:36px;line-height:1}
.sheet p{margin:0;color:var(--mute);line-height:1.5;font-size:15px}
.sheet ul{margin:0;padding-left:18px;line-height:1.5;font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.sheet .row{display:flex;gap:10px;margin-top:6px}
.sheet .big{padding:4px 0}
@media (prefers-reduced-motion:reduce){.sheet,.big .stars svg.on{animation:none}}

#dock{flex-direction:column;gap:6px;min-height:0}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-family:var(--display);font-weight:700;font-size:14px;color:var(--mute)}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.drow{display:flex;gap:8px;min-height:74px}
.tw small.t{font-family:var(--mono);font-size:10px;color:var(--mute)}
#banner{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);max-width:94%;background:rgba(10,3,8,.82);border:1px solid var(--line);border-radius:10px;padding:5px 12px;font-size:13px;font-weight:700;text-align:center;z-index:4;pointer-events:none}
#banner:empty{display:none}
#banner.warn{border-color:#ff8a4c;color:#ffb98a}
.ab{flex:none;width:82px;font-size:13px;line-height:1.05;position:relative;overflow:hidden;padding:0 4px}
.ab i{position:absolute;left:0;bottom:0;height:4px;background:#ff8a4c;width:100%}
.ab.on{background:#ff8a4c;color:#2a1000;border-color:#ff8a4c}
#wave{font-size:14px;line-height:1.1;padding:0 8px}
</style>

/* ====== controlador ====== */
const stage=$('#stage'),dock=$('#dock'),toastEl=$('#toast'),modal=$('#modal');
const cleanups=[];
const runCleanups=()=>{while(cleanups.length){try{cleanups.pop()()}catch(e){}}};
let toastT=0,cur=0;
const api={
  toast(m,bad){toastEl.textContent=m;toastEl.className='show'+(bad?' bad':'');clearTimeout(toastT);toastT=setTimeout(()=>{toastEl.className=''},1800)},
  later(fn,ms){const id=setTimeout(fn,ms);cleanups.push(()=>clearTimeout(id))},
  on(el,ev,fn,o){el.addEventListener(ev,fn,o);cleanups.push(()=>el.removeEventListener(ev,fn,o))},
  loop(fn){let last=performance.now(),id,dead=false;const tick=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;fn(dt);if(!dead)id=requestAnimationFrame(tick)};id=requestAnimationFrame(tick);cleanups.push(()=>{dead=true;cancelAnimationFrame(id)})},
  win(n,detail){
    runCleanups();sfx.win();
    save.stars[cur]=Math.max(save.stars[cur],n);persist();
    const last=cur===LEVELS.length-1,sum=save.stars.reduce((a,b)=>a+b,0);
    let body=detail;if(last)body+=` Total: ${sum} de 15 estrelas. ${rank(sum)}`;
    api.later(()=>openModal({k:'Infecção controlada',t:['Garganta salva!','Intestino em equilíbrio!','Gripe derrotada!','Sangue limpo!','Tumor contido!'][cur],stars:n,p:body,
      buttons:[{label:'Repetir',fn:()=>play(cur)},last?{label:'Menu',primary:true,fn:toMenu}:{label:'Próxima doença',primary:true,fn:()=>play(cur+1)}]}),400);
  },
  lose(msg){
    runCleanups();sfx.lose();
    api.later(()=>openModal({k:'Infecção avançou',t:'O órgão caiu',p:msg,buttons:[{label:'Menu',fn:toMenu},{label:'Tentar de novo',primary:true,fn:()=>play(cur)}]}),400);
  }
};
function rank(s){return s>=14?'Título: Imunologista-chefe.':s>=10?'Título: Médico residente.':s>=6?'Título: Estudante de imunologia.':'Título: Estagiário de laboratório. Dá para melhorar.'}

function openModal(o){
  modal.hidden=false;
  modal.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="k">${o.k||''}</div><h3>${o.t||''}</h3>
  ${o.stars!=null?`<div class="big">${stars(o.stars)}</div>`:''}${o.p?`<p>${o.p}</p>`:''}
  ${o.list?`<ul>${o.list.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
  <div class="row">${o.buttons.map((b,i)=>`<button class="btn ${b.primary?'primary':''}" data-i="${i}">${b.label}</button>`).join('')}</div></div>`;
  modal.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{const b=o.buttons[+btn.dataset.i];modal.hidden=true;modal.innerHTML='';b.fn()}));
  const p=modal.querySelector('.primary');if(p)p.focus({preventScroll:true});
}
function toMenu(){runCleanups();modal.hidden=true;$('#game').hidden=true;$('#menu').hidden=false;renderMenu()}
$('#back').addEventListener('click',toMenu);

function play(i){
  runCleanups();cur=i;const L=LEVELS[i];
  $('#menu').hidden=true;$('#game').hidden=false;
  $('#gtitle').innerHTML=`<small>Fase ${i+1} de 5 · ${L.tag.split(' · ')[1]}</small>${L.name}`;
  dock.innerHTML='';toastEl.className='';$('#banner').textContent='';
  openModal({k:'Fase '+(i+1)+' · '+L.tag,t:L.name,p:L.intro,list:L.rules,buttons:[{label:'Menu',fn:toMenu},{label:'Começar',primary:true,fn:()=>runLevel(L)}]});
}

  const sum=save.stars.reduce((a,b)=>a+b,0);

      <span><small>${L.tag}</small><h3>${L.name}</h3><p>${open?L.short:'Conclua a fase '+i+' para liberar'}</p></span>${stars(save.stars[i])}</button></li>`}).join('')}</ol>

/* ====== motor do jogo ====== */
function runLevel(L){
  const COLS=7,ROWS=9,WAVES=L.waves.length,MAXHP=20;
  const cv=$('#cv'),ctx=cv.getContext('2d'),bg=document.createElement('canvas');
  let cs=40,dpr=1;
  /* caminho */
  const pts=L.path.map(([c,r])=>({x:c+.5,y:r+.5}));
  const segs=[];let plen=0;
  for(let i=0;i<pts.length-1;i++){const l=Math.hypot(pts[i+1].x-pts[i].x,pts[i+1].y-pts[i].y);segs.push({a:pts[i],b:pts[i+1],l,s:plen});plen+=l}
  const cornerD=i=>i<=0?0:i>=segs.length?plen:segs[i].s;
  function posAt(d){
    d=clamp(d,0,plen);
    for(const s of segs)if(d<=s.s+s.l+1e-9){const t=s.l?(d-s.s)/s.l:0;return {x:s.a.x+(s.b.x-s.a.x)*t,y:s.a.y+(s.b.y-s.a.y)*t,a:Math.atan2(s.b.y-s.a.y,s.b.x-s.a.x)}}
    const s=segs[segs.length-1];return {x:s.b.x,y:s.b.y,a:Math.atan2(s.b.y-s.a.y,s.b.x-s.a.x)};
  }
  const zones=(L.zones||[]).map(z=>({d0:cornerD(z.a),d1:cornerD(z.b),f:z.f}));
  const zoneF=d=>{for(const z of zones)if(d>=z.d0&&d<z.d1)return z.f;return 1};
  const grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  const special=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  for(let i=0;i<L.path.length-1;i++){
    let [c,r]=L.path[i];const [c2,r2]=L.path[i+1];
    const dc=Math.sign(c2-c),dr=Math.sign(r2-r);
    while(true){grid[r][c]='path';if(c===c2&&r===r2)break;c+=dc;r+=dr}
  }
  (L.amig||[]).forEach(([c,r])=>{special[r][c]='amig'});
  if(L.wall)for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]!=='path'&&L.wall(c,r))grid[r][c]='wall';
  const core=pts[pts.length-1],entry=pts[0];

  /* estado */
  let atp=L.atp,hp=MAXHP,simT=0,started=0,autoT=20,over=false,paused=false,speed=1,coreFlash=0,shake=0;
  let fever=0,infl=0,escape=null,escGap=6,chk=0,targeting=null,tab='cel';
  let enemies=[],towers=[],meds=[],blocks=[],projs=[],fx=[],events=[],rbc=[];
  let sel={type:'cel',id:L.towers[0]},selObj=null,hover=null,lastUi='';
  const ab={};L.abil.forEach(id=>{ab[id]={cd:0}});
  const medDef=id=>id==='drg'?Object.assign({},MEDS.drg,{name:L.drug.name,short:L.drug.sh||L.drug.name,desc:L.drug.desc}):MEDS[id];

  /* layout */
  function layout(){
    const W=stage.clientWidth,Hh=stage.clientHeight-58;
    cs=Math.max(24,Math.floor(Math.min(W/COLS,Hh/ROWS)));dpr=Math.min(2,window.devicePixelRatio||1);
    const w=COLS*cs,h=ROWS*cs;
    cv.style.width=w+'px';cv.style.height=h+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
    cv.style.left=((W-w)/2)+'px';
    renderBg();
  }
  /* formas */
  function heart(g,x,y,s){g.beginPath();g.moveTo(x,y+.35*s);g.bezierCurveTo(x-.6*s,y-.05*s,x-.35*s,y-.55*s,x,y-.2*s);g.bezierCurveTo(x+.35*s,y-.55*s,x+.6*s,y-.05*s,x,y+.35*s);g.closePath()}
  function blob(g,x,y,r,n,bump,ph){g.beginPath();for(let i=0;i<=n*8;i++){const a=i/(n*8)*Math.PI*2,rr=r*(1+bump*Math.sin(a*n+ph));const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;i?g.lineTo(px,py):g.moveTo(px,py)}g.closePath()}
  function capsule(g,w,h){const r=h/2;g.beginPath();g.arc(-w/2+r,0,r,Math.PI/2,Math.PI*1.5);g.arc(w/2-r,0,r,-Math.PI/2,Math.PI/2);g.closePath()}
  function rangeLine(g,d0,d1){g.beginPath();let first=true;for(let d=d0;d<d1+.0001;d+=.08){const p=posAt(Math.min(d,d1));first?g.moveTo(p.x,p.y):g.lineTo(p.x,p.y);first=false}}
  function strokeRange(g,d0,d1,w,col,cap){g.lineJoin='round';g.lineCap=cap||'round';rangeLine(g,d0,d1);g.strokeStyle=col;g.lineWidth=w;g.stroke()}
  function lab(g,s,x,y,al){g.save();g.setTransform(dpr,0,0,dpr,0,0);g.font=`500 ${Math.max(8,Math.round(cs*.19))}px 'DM Mono',monospace`;g.textAlign=al||'center';g.textBaseline='middle';g.fillStyle='rgba(255,235,240,.6)';g.fillText(s,x*cs,y*cs);g.restore()}
  const PC={1:['#5c1a2f','#8f2c47'],2:['#5a2a1c','#8a4a30'],3:['#5c2a3a','#9a4a62'],4:['#5a0f1b','#a3202f'],5:['#4a2036','#8e3a5e']}[L.id];
  const vranges=L.id===4?[{d0:0,d1:cornerD(2),w:1},{d0:cornerD(2),d1:cornerD(6),w:.55},{d0:cornerD(6),d1:plen,w:1}]:[{d0:0,d1:plen,w:1}];

  /* ---- arte de fundo por órgão ---- */
  function art(g,rd){
    if(L.id===1){
      const gr=g.createRadialGradient(3.5,4,.5,3.5,4,6.5);gr.addColorStop(0,'#8a2e44');gr.addColorStop(1,'#37101b');g.fillStyle=gr;g.fillRect(0,0,COLS,ROWS);
      for(let i=0;i<26;i++){g.fillStyle=hexA('#d23a55',.1+rd()*.12);blob(g,rd()*7,rd()*9,.3+rd()*.5,3,.2,rd()*6);g.fill()}
      for(let i=0;i<44;i++){g.fillStyle=hexA('#c94a63',.35);g.beginPath();g.arc(rd()*7,rd()*9,.03+rd()*.05,0,7);g.fill()}
      g.fillStyle='#b8506a';g.beginPath();g.ellipse(3.5,9.5,4.6,2.4,0,0,Math.PI*2);g.fill();
      g.fillStyle='#c24a63';g.beginPath();g.ellipse(3.5,-1.4,4.4,2.6,0,0,Math.PI);g.fill();g.strokeStyle='#7a2236';g.lineWidth=.1;g.stroke();
      g.fillStyle='#e98a9b';g.beginPath();g.moveTo(3.2,1.1);g.quadraticCurveTo(3.05,1.9,3.5,2.05);g.quadraticCurveTo(3.95,1.9,3.8,1.1);g.closePath();g.fill();g.strokeStyle='#a8344c';g.lineWidth=.05;g.stroke();
      [[.45,4],[6.55,4]].forEach(([x,y])=>{
        g.fillStyle='#e8788f';g.beginPath();g.ellipse(x,y,.8,1.2,0,0,7);g.fill();g.strokeStyle='#a8344c';g.lineWidth=.07;g.stroke();
        for(let i=0;i<7;i++){g.fillStyle='rgba(120,20,45,.55)';g.beginPath();g.ellipse(x+(rd()-.5)*.9,y+(rd()-.5)*1.5,.05,.09,0,0,7);g.fill()}
        for(let i=0;i<4;i++){g.fillStyle='#f6e7b4';g.beginPath();g.arc(x+(rd()-.5)*.8,y+(rd()-.5)*1.4,.05+rd()*.03,0,7);g.fill()}
      });
    }else if(L.id===2){
      g.fillStyle='#24101a';g.fillRect(0,0,COLS,ROWS);

  const upCost=t=>Math.round(TOWERS[t.k].cost*(t.lv===1?.8:1.2));

  /* ---- combate ---- */
  function spawn(id,d){const D=EN[id];const e={id,k:D.k,hp:D.hp,max:D.hp,sp:D.sp,ar:D.ar,dm:D.dm,bt:D.bt,d:d||0,markT:0,hit:0,sd:Math.random()*6,sc:0,drug:0,xs:1,dead:false};enemies.push(e);return e}
  function hurt(e,base,kind,vac){
    if(e.dead)return;
    let d=base*MULT[kind][e.k]*(e.markT>0?1.35:1)*(e.drug>0?1.25:1)*(vac&&e.k===L.kind?1.4:1);
    if(escape&&e.k==='tum'&&escape.k===kind)d*=.35;
    d=Math.max(d*.2,d-e.ar);e.hp-=d;e.hit=.1;
    if(e.hp<=0)kill(e);
  }
  function kill(e){
    if(e.dead)return;
    e.dead=true;atp+=e.bt;sfx.pop();
    const p=posAt(e.d);
    fx.push({t:'txt',x:p.x,y:p.y-.2,age:0,dur:.8,s:'+'+e.bt,c:'#ffd166'});
    const col=({bac:'#7ddc6a',fun:'#b07cf0',vir:'#ff6b5a',par:'#e9a86b',tum:'#ff4fa3'})[e.k];
    const n=e.id==='tum'?26:6;
    for(let i=0;i<n;i++){const a=Math.random()*7,sp=rnd(.6,1.8);fx.push({t:'dot',x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,age:0,dur:.5,c:col,r:rnd(.03,.07)})}
    if(e.id==='mom'){spawn('vir',e.d);spawn('vir',Math.max(0,e.d-.3))}
  }
  function pick(t,range){
    let best=null;
    for(const e of enemies){
      if(e.dead)continue;const p=posAt(e.d);if(Math.hypot(p.x-t.x,p.y-t.y)>range)continue;
      if(!best){best=e;continue}
      if(t.k==='t'){if(e.hp>best.hp)best=e}
      else if(t.k==='b'){const bm=best.markT>0,em=e.markT>0;if((bm&&!em)||(bm===em&&e.d>best.d))best=e}
      else if(e.d>best.d)best=e;
    }
    return best;
  }
  function startWave(){
    if(started>=WAVES||over)return;
    const groups=L.waves[started];started++;
    groups.forEach(g=>{for(let i=0;i<g.n;i++)events.push({t:simT+g.delay+i*g.gap,id:g.id})});
    events.sort((a,b)=>a.t-b.t);autoT=20;sfx.wave();
    api.toast(`Onda ${started} de ${WAVES}`);
  }
  function dAtTile(c,r){let best=-1,bd=.62;for(let d=0;d<=plen;d+=.05){const p=posAt(d),q=Math.hypot(p.x-(c+.5),p.y-(r+.5));if(q<bd){bd=q;best=d}}return best}

  /* ---- habilidades ---- */
  function fireAbility(id,arg){
    ab[id].cd=ABIL[id].cd;sfx.skill();
    if(id==='infl'){infl=8;api.toast('Inflamação: defensores 40% mais rápidos por 8 s')}
    else if(id==='diar'){enemies.forEach(e=>{e.d=Math.max(0,e.d-5)});for(let d=0;d<plen;d+=.5){const p=posAt(d);fx.push({t:'ring',x:p.x,y:p.y,age:-d*.012,dur:.5,r0:.1,r1:.6,c:'#e0a870'})}api.toast('Diarreia: invasores expulsos 5 casas para trás')}
    else if(id==='fever'){fever=6;api.toast('Febre: invasores 50% mais lentos por 6 s')}
    else if(id==='sneeze'){
      const {x,y}=arg;fx.push({t:'ring',x,y,age:0,dur:.45,r0:.2,r1:1.7,c:'#bfe8ff'});
      for(let i=0;i<22;i++){const a=Math.random()*7,sp=rnd(1.5,3.5);fx.push({t:'dot',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,age:0,dur:.45,c:'#d8f0ff',r:.05})}
      for(const e of enemies){const p=posAt(e.d);if(Math.hypot(p.x-x,p.y-y)<=1.7){e.hp-=45;e.hit=.15;e.d=Math.max(0,e.d-3);if(e.hp<=0)kill(e)}}
    }
    else if(id==='clot'){blocks.push({d:arg.d,hp:160,max:160,age:0});api.toast('Coágulo formado: invasores presos até destruí-lo')}
    else if(id==='check'){escape=null;escGap=8;chk=8;api.toast('Checkpoint: escape imune bloqueado por 8 s')}
  }
  function useAbility(id){
    const A=ABIL[id];if(ab[id].cd>0||over)return;
    if(A.target){targeting=targeting===id?null:id;api.toast(id==='sneeze'?'Toque no mapa onde quer espirrar':'Toque numa casa do vaso sanguíneo');lastUi='';return}
    fireAbility(id);lastUi='';
  }

  /* ---- simulação ---- */
  const periTT=()=>simT%16;
  const periActive=()=>L.id===2&&periTT()>=14;
  for(let i=0;i<30;i++)rbc.push({d:Math.random()*plen,off:rnd(-.16,.16)});
  function step(dt){
    simT+=dt;
    if(fever>0)fever-=dt;if(infl>0)infl-=dt;if(chk>0)chk-=dt;if(coreFlash>0)coreFlash-=dt;if(shake>0)shake-=dt;
    for(const k in ab)if(ab[k].cd>0)ab[k].cd-=dt;
    /* remédios expiram */
    for(const m of meds){m.t-=dt;if(m.t<=0){grid[m.r][m.c]=null;if(selObj===m){selObj=null;palette()}}}
    meds=meds.filter(m=>m.t>0);
    for(const b of blocks)b.age+=dt;
    blocks=blocks.filter(b=>b.hp>0&&b.age<25);
    /* escape imune */
    if(L.id===5){
      if(escape){escape.left-=dt;if(escape.left<=0){escape=null;escGap=4}}
      else if(chk<=0){escGap-=dt;if(escGap<=0){const opts=L.towers.filter(k=>k!==(escape&&escape.k));escape={k:opts[ri(opts.length)],left:9}}}
    }
    for(const r of rbc){r.d+=1.1*zoneF(r.d)*dt;if(r.d>plen)r.d=0}
    while(events.length&&events[0].t<=simT)spawn(events.shift().id,0);
    if(started>0&&started<WAVES&&!events.length){autoT-=dt;if(autoT<=0)startWave()}
    const fs=fever>0?.5:1,ps=periActive()?1.9:1;
    for(const e of enemies){
      if(e.dead)continue;
      if(e.markT>0)e.markT-=dt;if(e.hit>0)e.hit-=dt;
      const p0=posAt(e.d);e.xs=1;
      for(const m of meds){
        if(m.id!=='xar'&&m.id!=='drg')continue;
        if(Math.hypot(m.x-p0.x,m.y-p0.y)>medDef(m.id).rad)continue;
        if(m.id==='xar')e.xs=.6;else if(e.k===L.kind)e.drug=.3;
      }
      if(e.drug>0){e.drug-=dt;e.hp-=4*dt;if(e.hp<=0){kill(e);continue}}
      let nd=e.d+e.sp*zoneF(e.d)*(e.markT>0?.7:1)*e.xs*fs*ps*dt;
      for(const b of blocks){const stop=b.d-.3;if(e.d<b.d&&nd>=stop){nd=Math.min(nd,Math.max(e.d,stop));if(nd>=stop-.02)b.hp-=e.dm*9*dt}}
      e.d=nd;
      if(e.id==='tum'){e.sc+=dt;if(e.sc>=3){e.sc=0;spawn('mut',Math.max(0,e.d-.4))}}
      if(e.d>=plen){e.dead=true;hp-=e.dm;coreFlash=.45;shake=.25;sfx.leak();fx.push({t:'txt',x:core.x,y:core.y-.5,age:0,dur:1,s:'-'+e.dm,c:'#ff5d6c'})}
    }
    enemies=enemies.filter(e=>!e.dead);
    for(const t of towers){
      if(t.fl>0)t.fl-=dt;t.cd-=dt;if(t.cd>0)continue;
      const st=stat(t),tg=pick(t,st.range);if(!tg)continue;
      const tp=posAt(tg.d);t.ang=Math.atan2(tp.y-t.y,tp.x-t.x);t.cd=st.rate;t.fl=.12;
      if(t.k==='n')projs.push({x:t.x,y:t.y,tg,sp:9,dmg:st.dmg,k:'n',c:'#e6f2ff',vac:st.vac});
      else if(t.k==='b')projs.push({x:t.x,y:t.y,tg,sp:7,dmg:st.dmg,k:'b',c:'#5ee6e0',mark:st.mark,vac:st.vac});
      else if(t.k==='m'){
        hurt(tg,st.dmg,'m',st.vac);
        for(const o of enemies){if(o===tg||o.dead)continue;const q=posAt(o.d);if(Math.hypot(q.x-tp.x,q.y-tp.y)<=.9)hurt(o,st.dmg*.6,'m',st.vac)}
        fx.push({t:'ring',x:tp.x,y:tp.y,age:0,dur:.3,r0:.1,r1:.9,c:'#ffe3a3'});
      }else{
        hurt(tg,st.dmg,'t',st.vac);fx.push({t:'beam',x:t.x,y:t.y,x2:tp.x,y2:tp.y,age:0,dur:.18,c:'#d8c8ff'});fx.push({t:'ring',x:tp.x,y:tp.y,age:0,dur:.25,r0:.05,r1:.4,c:'#b79cff'});
      }
    }
    enemies=enemies.filter(e=>!e.dead);
    for(const p of projs){
      if(p.tg.dead){p.gone=true;continue}
      const q=posAt(p.tg.d),dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy),mv=p.sp*dt;
      if(d<=mv+.1){hurt(p.tg,p.dmg,p.k,p.vac);if(p.k==='b'&&!p.tg.dead)p.tg.markT=Math.max(p.tg.markT,p.mark);p.gone=true}
      else{p.x+=dx/d*mv;p.y+=dy/d*mv}
    }
    projs=projs.filter(p=>!p.gone);enemies=enemies.filter(e=>!e.dead);
    for(const f of fx){f.age+=dt;if(f.t==='dot'){f.x+=f.vx*dt;f.y+=f.vy*dt}else if(f.t==='txt')f.y-=.5*dt}
    fx=fx.filter(f=>f.age<f.dur);
    if(hp<=0&&!over){over=true;hp=0;sync();api.lose('A infecção chegou ao órgão. Use cada defensor contra o invasor certo e reforce o caminho com remédios e habilidades.');return}
    if(started>=WAVES&&!events.length&&!enemies.length&&!over){
      over=true;const fr=hp/MAXHP,st=fr>=.8?3:fr>=.4?2:1;
      sync();api.win(st,`Todas as ${WAVES} ondas foram contidas. Saúde final: ${hp} de ${MAXHP}.`);
    }
  }

  /* ---- desenho ---- */
  const bannerEl=$('#banner');let lastBanner='';
  function draw(){
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(bg,0,0);
    ctx.setTransform(dpr*cs,0,0,dpr*cs,0,0);
    if(shake>0)ctx.translate(Math.sin(simT*80)*.04,0);
    ctx.save();ctx.lineJoin='round';ctx.strokeStyle='rgba(255,190,205,.16)';ctx.lineWidth=.1;ctx.setLineDash([.08,.5]);ctx.lineDashOffset=-simT*.9;rangeLine(ctx,0,plen);ctx.stroke();ctx.restore();
    if(L.id===4)for(const r of rbc){const p=posAt(r.d),nx=-Math.sin(p.a)*r.off,ny=Math.cos(p.a)*r.off;ctx.fillStyle='#d8343f';ctx.beginPath();ctx.arc(p.x+nx,p.y+ny,.1,0,7);ctx.fill();ctx.fillStyle='#8a1a26';ctx.beginPath();ctx.arc(p.x+nx,p.y+ny,.045,0,7);ctx.fill()}
    if(L.id===3){for(let d=.1;d<cornerD(2);d+=.22){const p=posAt(d),nx=-Math.sin(p.a),ny=Math.cos(p.a);for(const s of[-1,1]){const w=Math.sin(simT*8+d*6)*.08;ctx.strokeStyle='rgba(255,215,225,.7)';ctx.lineWidth=.04;ctx.beginPath();ctx.moveTo(p.x+nx*.3*s,p.y+ny*.3*s);ctx.lineTo(p.x+nx*.14*s+Math.cos(p.a)*w,p.y+ny*.14*s+Math.sin(p.a)*w);ctx.stroke()}}}
    if(periActive()){const f=(periTT()-14)/2*plen;strokeRangeCtx(Math.max(0,f-2.5),Math.min(plen,f),.8,'rgba(255,220,170,.3)')}
    ctx.save();ctx.translate(entry.x,entry.y);ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.moveTo(-.14,-.16);ctx.lineTo(.18,0);ctx.lineTo(-.14,.16);ctx.closePath();ctx.fill();ctx.restore();
    drawCore(1+Math.sin(performance.now()/260)*.05+(coreFlash>0?.15:0));
    if(selObj&&!selObj.med){const st=stat(selObj);ring(selObj.x,selObj.y,st.range,'rgba(94,230,224,.9)',.04);ctx.fillStyle='rgba(94,230,224,.1)';ctx.beginPath();ctx.arc(selObj.x,selObj.y,st.range,0,7);ctx.fill()}
    for(const m of meds)drawMed(m);
    for(const t of towers)drawTower(t);
    if(hover&&!targeting&&!selObj&&hover.r>=0&&hover.r<ROWS&&hover.c>=0&&hover.c<COLS&&!grid[hover.r][hover.c]){
      const x=hover.c+.5,y=hover.r+.5;
      if(sel.type==='cel'){const b=TOWERS[sel.id];ctx.fillStyle='rgba(255,255,255,.06)';ctx.beginPath();ctx.arc(x,y,b.range,0,7);ctx.fill();ring(x,y,b.range,atp>=b.cost?'rgba(255,255,255,.4)':'rgba(255,93,108,.7)',.03);drawTower({k:sel.id,x,y,lv:1,fl:0},true)}
      else{const D=medDef(sel.id);ring(x,y,D.rad,atp>=D.cost?hexA(D.col,.7):'rgba(255,93,108,.7)',.03)}
    }
    if(targeting&&hover){const x=hover.c+.5,y=hover.r+.5;if(targeting==='sneeze')ring(x,y,1.7,'rgba(191,232,255,.8)',.04);else ring(x,y,.5,'rgba(255,209,102,.9)',.05)}
    for(const b of blocks)drawBlock(b);
    for(const e of enemies){drawEnemy(e);drawStatus(e)}
    for(const p of projs){ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.k==='b'?.08:.06,0,7);ctx.fill();if(p.k==='b'){ctx.strokeStyle=p.c;ctx.lineWidth=.03;ctx.beginPath();ctx.moveTo(p.x-.08,p.y-.1);ctx.lineTo(p.x,p.y);ctx.lineTo(p.x+.08,p.y-.1);ctx.stroke()}}
    for(const f of fx){
      if(f.age<0)continue;const k=f.age/f.dur;
      if(f.t==='ring'){ctx.globalAlpha=1-k;ring(f.x,f.y,f.r0+(f.r1-f.r0)*k,f.c,.06);ctx.globalAlpha=1}
      else if(f.t==='dot'){ctx.globalAlpha=1-k;ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill();ctx.globalAlpha=1}
      else if(f.t==='beam'){ctx.globalAlpha=1-k;ctx.strokeStyle=f.c;ctx.lineWidth=.08;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x2,f.y2);ctx.stroke();ctx.globalAlpha=1}
    }
    if(fever>0){ctx.fillStyle=`rgba(255,120,60,${.07+Math.sin(simT*6)*.03})`;ctx.fillRect(0,0,COLS,ROWS)}
    if(infl>0){ctx.strokeStyle=`rgba(255,80,80,${.35+Math.sin(simT*8)*.15})`;ctx.lineWidth=.2;ctx.strokeRect(.05,.05,COLS-.1,ROWS-.1)}
    for(const f of fx)if(f.t==='txt')txt(f.s,f.x,f.y,Math.max(11,cs*.3),f.c,1-f.age/f.dur);
    /* faixa de aviso */
    let bt='',warn=false;
    if(L.id===2){const tt=periTT();if(tt>=14){bt='Contração intestinal! Invasores acelerados';warn=true}else if(tt>=12.5){bt=`Contração em ${Math.ceil(14-tt)} s`;warn=true}}
    if(L.id===5){if(escape){bt='Escape imune: tumor resiste a '+TOWERS[escape.k].name;warn=true}else if(chk>0)bt='Checkpoint ativo: sem escape'}
    if(bt!==lastBanner){lastBanner=bt;bannerEl.textContent=bt;bannerEl.className=warn?'warn':''}
  }
  function strokeRangeCtx(d0,d1,w,col){ctx.lineJoin='round';ctx.lineCap='round';rangeLine(ctx,d0,d1);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke()}

  /* ---- interface ---- */
  const pHp=$('#p-hp'),pAtp=$('#p-atp'),pWave=$('#p-wave'),waveBtn=$('#wave'),ctl=$('#ctl');
  ctl.querySelectorAll('.ab').forEach(b=>b.remove());
  L.abil.forEach(id=>{const b=document.createElement('button');b.className='btn ab';b.dataset.a=id;b.innerHTML=ABIL[id].name+'<i></i>';ctl.appendChild(b);api.on(b,'click',()=>useAbility(id))});
  const abOn=id=>targeting===id||(id==='fever'&&fever>0)||(id==='infl'&&infl>0)||(id==='check'&&chk>0);
  function sync(){
    const a=Math.floor(atp);
    const ui=[hp,a,started,speed,paused,Math.ceil(autoT),events.length,targeting,tab,L.abil.map(id=>Math.ceil(ab[id].cd)+(abOn(id)?'o':'')).join(','),selObj?Math.ceil(selObj.t||0):'',sel.id].join('|');
    if(ui===lastUi)return;
    lastUi=ui;
    pHp.innerHTML=HEART+`<span>${hp}</span><span class="l">saúde</span>`;
    pAtp.innerHTML=ATPI+`<span>${a}</span><span class="l">ATP</span>`;
    pWave.innerHTML=`<span class="l">onda</span><span>${Math.max(1,started)}/${WAVES}</span>`;
    if(started===0){waveBtn.textContent='Iniciar onda 1';waveBtn.disabled=false}
    else if(started>=WAVES){waveBtn.textContent='Última onda em curso';waveBtn.disabled=true}
    else{waveBtn.disabled=false;waveBtn.textContent=events.length?`Chamar onda ${started+1}`:`Onda ${started+1} em ${Math.ceil(autoT)}s (chamar)`}
    ctl.querySelectorAll('.ab').forEach(b=>{const id=b.dataset.a,s=ab[id],A=ABIL[id];b.firstChild.textContent=s.cd>0?`${A.name} ${Math.ceil(s.cd)}s`:A.name;b.disabled=s.cd>0;b.classList.toggle('on',abOn(id));b.querySelector('i').style.width=(s.cd>0?(1-s.cd/A.cd)*100:100)+'%'});
    $('#pause').textContent=paused?'▶':'II';$('#speed').textContent=speed+'x';
    poor();
    const mt=$('#mt');if(mt&&selObj&&selObj.med)mt.textContent=Math.ceil(selObj.t);
  }
  function poor(){
    dock.querySelectorAll('.tw').forEach(b=>b.classList.toggle('poor',atp<+b.dataset.cost));
    const up=$('#up');if(up&&selObj&&!selObj.med)up.disabled=selObj.lv>=3||atp<upCost(selObj);
    const rn=$('#renew');if(rn&&selObj&&selObj.med)rn.disabled=atp<medDef(selObj.id).cost;
  }
  function palette(){
    selObj=null;
    let row='';
    if(tab==='cel')row=L.towers.map(k=>`<button class="tw ${sel.type==='cel'&&sel.id===k?'sel':''}" data-type="cel" data-k="${k}" data-cost="${TOWERS[k].cost}">${TOWER_ICON(k)}<b>${TOWERS[k].name}</b><span>${TOWERS[k].cost} ATP</span></button>`).join('');
    else row=L.meds.map(k=>{const D=medDef(k);return `<button class="tw ${sel.type==='med'&&sel.id===k?'sel':''}" data-type="med" data-k="${k}" data-cost="${D.cost}">${MED_ICON(k)}<b>${D.short}</b><span>${D.cost} ATP</span></button>`}).join('');
    dock.innerHTML=`<div class="tabs"><button data-t="cel" class="${tab==='cel'?'on':''}">Células</button><button data-t="med" class="${tab==='med'?'on':''}">Remédios</button></div><div class="drow">${row}</div>`;
    dock.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.t;sel=tab==='cel'?{type:'cel',id:L.towers[0]}:{type:'med',id:L.meds[0]};sfx.tap();palette();lastUi=''}));
    dock.querySelectorAll('.tw').forEach(b=>b.addEventListener('click',()=>{sel={type:b.dataset.type,id:b.dataset.k};sfx.tap();if(sel.type==='med'){const D=medDef(sel.id);api.toast(D.name+': '+D.desc)}palette();lastUi=''}));
    lastUi='';
  }
  function panel(o){
    selObj=o;
    if(o.med){
      const D=medDef(o.id);
      dock.innerHTML=`<div class="tp"><div class="info"><b>${D.name}</b><small>${D.desc}<br>Age por mais <span id="mt">${Math.ceil(o.t)}</span> s</small></div><button class="btn" id="renew">Renovar dose<small>${D.cost} ATP</small></button><button class="btn x" id="cl" aria-label="Fechar">×</button></div>`;
      $('#renew').addEventListener('click',()=>{if(atp<D.cost){api.toast('ATP insuficiente',true);return}atp-=D.cost;o.t=D.dur;sfx.place();lastUi='';sync()});
    }else{
      const b=TOWERS[o.k],st=stat(o),sv=started===0?o.paid:Math.floor(o.paid*.7);
      dock.innerHTML=`<div class="tp"><div class="info"><b>${b.name} · nível ${o.lv}</b><small>Dano ${Math.round(st.dmg)} · alcance ${st.range.toFixed(1)}${o.amig?' · amígdala +35%':''}<br>Forte contra ${b.good}</small></div>
      <button class="btn" id="up">${o.lv>=3?'Nível máximo':'Evoluir'}<small>${o.lv>=3?'':upCost(o)+' ATP'}</small></button>
      <button class="btn" id="sell">Vender<small>+${sv} ATP</small></button><button class="btn x" id="cl" aria-label="Fechar">×</button></div>`;
      $('#up').addEventListener('click',()=>{if(o.lv>=3)return;const c=upCost(o);if(atp<c){api.toast('ATP insuficiente',true);return}atp-=c;o.paid+=c;o.lv++;o.fl=.3;sfx.place();fx.push({t:'ring',x:o.x,y:o.y,age:0,dur:.4,r0:.2,r1:.7,c:'#ffd166'});panel(o);lastUi='';sync()});
      $('#sell').addEventListener('click',()=>{atp+=sv;towers.splice(towers.indexOf(o),1);grid[o.r][o.c]=null;sfx.tap();palette();lastUi='';sync()});
    }
    $('#cl').addEventListener('click',()=>{palette();lastUi='';sync()});
    lastUi='';sync();
  }
  function tileAt(e){const r=cv.getBoundingClientRect();return {c:Math.floor((e.clientX-r.left)/cs),r:Math.floor((e.clientY-r.top)/cs),x:(e.clientX-r.left)/cs,y:(e.clientY-r.top)/cs}}
  api.on(cv,'pointerdown',e=>{
    if(over)return;
    const {c,r,x,y}=tileAt(e);if(c<0||r<0||c>=COLS||r>=ROWS)return;
    hover={c,r};
    if(targeting){
      const id=targeting;
      if(id==='sneeze'){targeting=null;fireAbility('sneeze',{x,y})}
      else{
        if(grid[r][c]!=='path'){api.toast('O coágulo só se forma dentro do vaso.',true);return}
        if(blocks.length>=2){api.toast('Já há 2 coágulos ativos.',true);return}
        targeting=null;fireAbility('clot',{d:dAtTile(c,r)});
      }
      lastUi='';sync();return;
    }
    const cell=grid[r][c];
    if(cell==='wall'){api.toast('Osso do crânio: não dá para posicionar aqui.',true);return}
    if(cell&&cell!=='path'){panel(cell);sfx.tap();return}
    if(cell==='path'){if(selObj){palette();lastUi='';sync()}else api.toast('Defensores e remédios ficam no tecido, fora do vaso.');return}
    if(selObj){palette();lastUi='';sync();return}
    if(sel.type==='cel'){
      const b=TOWERS[sel.id];if(atp<b.cost){api.toast('ATP insuficiente',true);return}
      atp-=b.cost;const t={k:sel.id,c,r,x:c+.5,y:r+.5,lv:1,cd:.3,ang:0,paid:b.cost,fl:.2,amig:special[r][c]==='amig'};
      towers.push(t);grid[r][c]=t;sfx.place();fx.push({t:'ring',x:t.x,y:t.y,age:0,dur:.35,r0:.1,r1:.6,c:'#ffffff'});
    }else{
      const D=medDef(sel.id);if(atp<D.cost){api.toast('ATP insuficiente',true);return}
      atp-=D.cost;const m={med:true,id:sel.id,c,r,x:c+.5,y:r+.5,t:D.dur};
      meds.push(m);grid[r][c]=m;sfx.place();fx.push({t:'ring',x:m.x,y:m.y,age:0,dur:.4,r0:.1,r1:D.rad,c:D.col});
    }
    lastUi='';sync();
  });
  api.on(cv,'pointermove',e=>{hover=tileAt(e)});
  api.on(cv,'pointerleave',()=>{hover=null});
  api.on(waveBtn,'click',()=>{if(over)return;startWave();lastUi='';sync()});
  api.on($('#pause'),'click',()=>{paused=!paused;lastUi='';sync()});
  api.on($('#speed'),'click',()=>{speed=speed===1?2:1;lastUi='';sync()});
  api.on(window,'resize',layout);
  layout();palette();
  api.loop(dt=>{
    if(!paused&&!over){let rem=dt*speed;while(rem>0&&!over){const s=Math.min(rem,1/30);step(s);rem-=s}}
    draw();sync();
  });
  api.toast('Toque no tecido para posicionar defensores');
}

renderMenu();
})();
</script>

</body></html>
